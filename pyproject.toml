[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Polymarket data + paper-trading foundation (read-only, no real orders)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
polybot = "polybot.cli:app"

[tool.setuptools.packages.find]
include = ["polybot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
