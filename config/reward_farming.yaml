# Reward-farming preset: quote tight (inside the reward zone), size by dollars
# so we qualify for liquidity rewards, and pull quotes on any real move (the
# markets barely move, so adverse selection should be small).
#
# Run:  POLYBOT_DB_PATH=... python -m polybot.cli mm-backtest --config config/reward_farming.yaml

strategy:
  pro_mm:
    # Deploy $1000 of liquidity per side, per token.
    target_notional_usd: 1000.0
    # Quote tight to maximize reward score; floor keeps us off the very inside.
    base_half_spread_cents: 1.0
    min_half_spread_cents: 1.0
    vol_spread_coeff: 0.5
    # Share counts are large (thousands), so skew-per-share must be tiny.
    inventory_skew_cents_per_share: 0.0002
    # Cap inventory by DOLLARS (robust across cheap/expensive tokens).
    max_inventory_usd: 1000.0
    max_inventory_shares: 40000
    min_size: 0
    # Only farm sensibly-priced markets (skip extreme longshots).
    min_mid: 0.05
    max_mid: 0.95
    # Volatility guard: these markets barely move, so pull on even a small move.
    vol_window_secs: 120
    jump_kill_cents: 1.0
    warmup_ticks: 3
    clamp_to_reward_zone: true
    starting_cash_usd: 20000.0
