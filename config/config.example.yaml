# polybot configuration (example). Copy to config/config.yaml and adjust.

# Public API hosts (read-only). Verified June 2026.
api:
  gamma_base: "https://gamma-api.polymarket.com"
  clob_base: "https://clob.polymarket.com"
  data_base: "https://data-api.polymarket.com"
  ws_market: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  timeout_seconds: 15.0
  max_retries: 3

# Data collector settings.
collector:
  poll_interval_seconds: 10
  # How many active markets to track per cycle (sorted by liquidity/volume).
  max_markets: 25
  # Only collect markets whose 24h volume (USD) is at least this much.
  min_volume_usd: 1000.0

# Paper-trading / simulation settings.
paper:
  starting_cash_usd: 1000.0
  # Polymarket taker fee fraction applied on notional. Conservative default;
  # Polymarket fees have historically been low/zero — keep a buffer for realism.
  taker_fee_bps: 0.0
  # Extra slippage assumption (basis points) applied on top of book walking.
  extra_slippage_bps: 10.0

# Risk limits — enforced even in paper mode.
risk:
  max_position_usd_per_market: 100.0
  max_total_exposure_usd: 500.0
  daily_loss_cap_usd: 50.0

# Strategy-specific parameters.
strategy:
  arb_scanner:
    # Minimum (1 - (best_ask_yes + best_ask_no)) edge to flag, in cents.
    min_edge_cents: 1.0
  naive_mm:
    # Half-spread (in cents) to quote around the midpoint.
    half_spread_cents: 2.0
    # Order size in shares per quote.
    order_size: 20.0
